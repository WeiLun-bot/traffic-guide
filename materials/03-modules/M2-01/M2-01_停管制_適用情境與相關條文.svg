<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="610" viewBox="0 0 1470 610"><title>停管制：適用情境與相關條文</title><desc>依使用者提供圖片重製，包含十個一般道路情境與四項相關條文。</desc><rect x="5" y="4" width="1460" height="602" rx="28" fill="#f2f2f2"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="37" fill="#111"><text x="50" y="65" font-weight="700">適用情境</text><text x="50" y="137" fill="#53616a" font-weight="300">G1-01</text><text x="192" y="137" >無號誌市區正交三叉路口</text><text x="760" y="137" fill="#53616a" font-weight="300">G1-02</text><text x="900" y="137" >無號誌鄉區正交三叉路口</text><text x="50" y="189" fill="#53616a" font-weight="300">G1-03</text><text x="192" y="189" >無號誌市區匯入型巷道路口</text><text x="760" y="189" fill="#53616a" font-weight="300">G1-04</text><text x="900" y="189" >無號誌鄉區匯入型巷道路口</text><text x="50" y="241" fill="#53616a" font-weight="300">G1-05</text><text x="192" y="241" >無號誌市區斜交三叉路口</text><text x="760" y="241" fill="#53616a" font-weight="300">G1-06</text><text x="900" y="241" >無號誌鄉區斜交三叉路口</text><text x="50" y="293" fill="#53616a" font-weight="300">G3-01</text><text x="192" y="293" >無號誌市區正交四叉路口</text><text x="760" y="293" fill="#53616a" font-weight="300">G3-02</text><text x="900" y="293" >無號誌鄉區正交四叉路口</text><text x="50" y="345" fill="#53616a" font-weight="300">G3-03</text><text x="192" y="345" >無號誌市區斜交四叉路口</text><text x="760" y="345" fill="#53616a" font-weight="300">G3-04</text><text x="900" y="345" >無號誌鄉區斜交四叉路口</text><path d="M50 376H1420" stroke="#d2d2d2" stroke-width="2"/><text x="50" y="451" font-weight="700">相關條文</text><text x="50" y="522" fill="#53616a" font-weight="300">§ 58</text><text x="192" y="522" >停車再開標誌「遵 1」</text><text x="760" y="522" fill="#53616a" font-weight="300">§ 170</text><text x="900" y="522" >停止線</text><text x="50" y="574" fill="#53616a" font-weight="300">§ 177</text><text x="192" y="574" >停標字</text><text x="760" y="574" fill="#53616a" font-weight="300">§ 189</text><text x="900" y="574" >路口行車導引線</text></g></svg>
